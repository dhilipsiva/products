# ci.yml template for a Node project such as EduStages (CONVENTIONS.md, "Templates"). Copy to
# .github/workflows/ci.yml. The repository commits package-lock.json and a .node-version file
# naming the Node release it supports, and defines the `lint`, `build` and `test` scripts. Every
# action is pinned to a full commit SHA with its release tag (CONVENTIONS.md, "Action pinning").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, build, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Audit dependencies
        # The JavaScript form of the advisory gate (CONVENTIONS.md, C8).
        run: npm audit --audit-level=high

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          cd "$RUNNER_TEMP"
          curl --silent --show-error --location --fail --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz actionlint
      - name: Check the workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
